name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, Typecheck, Unit-Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Firefox und WebKit nur unter ubuntu, Chromium überall
      PW_ALL_BROWSERS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser installieren (ubuntu, alle)
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps --no-shell chromium firefox webkit
      - name: Browser installieren (Chromium)
        if: matrix.os != 'ubuntu-latest'
        run: npx playwright install --with-deps --no-shell chromium
      # Firefox hat headless unter Linux kein WebGL: dort mit Fenster auf virtuellem X-Server
      - name: Playwright (ubuntu, Firefox mit xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run e2e
        env:
          PW_FIREFOX_HEADED: "1"
      - name: Playwright
        if: matrix.os != 'ubuntu-latest'
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
