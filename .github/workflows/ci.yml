name: CI

# Nur Ubuntu: macOS- und Windows-Minuten zählen im privaten Repo mehrfach und sprengen das
# Kontingent von GitHub Free. Die anderen Plattformen laufen von Hand über „CI Plattformen“.
on:
  push:
    branches: [main]
  pull_request:

# Ein neuer Push bricht den laufenden Durchlauf desselben Zweigs ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    env:
      PW_ALL_BROWSERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium firefox webkit
      # Firefox hat headless unter Linux kein WebGL: dort mit Fenster auf virtuellem X-Server
      - run: xvfb-run -a npm run e2e
        env:
          PW_FIREFOX_HEADED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
