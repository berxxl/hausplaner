deviceTypes:
  - id: "ac-outdoor"
    name: "Klima-Außengerät"
    trade: "refrigerant"
    symbol: "<rect x='10' y='20' width='80' height='60' stroke='currentColor' stroke-width='5' fill='none'/><circle cx='50' cy='50' r='20' stroke='currentColor' stroke-width='5' fill='none'/>"
